<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        #grid { 
            display: grid; 
            grid-template-columns: repeat(4, 100px); 
            gap: 10px; 
            justify-content: center; 
            margin-top: 20px;
        }
        .card { 
            width: 100px; 
            height: 100px; 
            background-color: #ccc; 
            cursor: pointer; 
            border: 2px solid #fff;
        }
        .card img {
            width: 100%;
            height: 100%;
            display: none; 
        }
    </style>
</head>
<body>

    
    <div id="result-board">
        <strong>Score: <span id="score">0</span>. <span id="message"></span></strong>
    </div>
    <div id="grid"></div>

    <script>
        
        const cardArray = [
            { name: 'color1', color: 'red' },
            { name: 'color1', color: 'red' },
            { name: 'color2', color: 'blue' },
            { name: 'color2', color: 'blue' },
            { name: 'color3', color: 'green' },
            { name: 'color3', color: 'green' },
            { name: 'color4', color: 'yellow' },
            { name: 'color4', color: 'yellow' }
        ];

       
        cardArray.sort(() => 0.5 - Math.random());

        const grid = document.querySelector('#grid');
        const resultDisplay = document.querySelector('#score');
        const messageDisplay = document.querySelector('#message');
        let cardsChosen = [];
        let cardsChosenId = [];
        let cardsWon = [];

        
        function createBoard() {
            for (let i = 0; i < cardArray.length; i++) {
                const card = document.createElement('div');
                card.setAttribute('class', 'card');
                card.setAttribute('data-id', i);
                
                // Thay vì ảnh, ta dùng màu nền để minh họa (hoặc setAttribute 'src' cho thẻ img bên trong)
                card.addEventListener('click', flipCard); // Bước 5: Thêm event listener
                grid.appendChild(card);
            }
        }

        
        function checkForMatch() {
            const cards = document.querySelectorAll('.card');
            const optionOneId = cardsChosenId[0];
            const optionTwoId = cardsChosenId[1];

            if (cardsChosen[0] === cardsChosen[1]) {
                messageDisplay.textContent = "You found a match!";
                cards[optionOneId].style.visibility = 'hidden';
                cards[optionTwoId].style.visibility = 'hidden';
                cardsWon.push(cardsChosen);
            } else {
                messageDisplay.textContent = "Try again!";
                cards[optionOneId].style.backgroundColor = '#ccc';
                cards[optionTwoId].style.backgroundColor = '#ccc';
            }

            cardsChosen = [];
            cardsChosenId = [];
            resultDisplay.textContent = cardsWon.length;
        }

        function flipCard() {
            let cardId = this.getAttribute('data-id');
            cardsChosen.push(cardArray[cardId].name);
            cardsChosenId.push(cardId);
            this.style.backgroundColor = cardArray[cardId].color;

            if (cardsChosen.length === 2) {
                
                setTimeout(checkForMatch, 500); 
            }
        }

        createBoard();
    </script>
</body>
</html>
