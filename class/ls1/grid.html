<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: auto auto auto;
            /* grid-template-columns: repeat(5, 1fr); 5 cột */
            /* grid-template-columns: 100px 100px; */
            border: 4px solid black;
            /* row-gap: 20px;  chỉnh khoảng giữa các hàng, gap : 35px; - chỉnh gap cả row và column */
            /* column-gap: 100px; */
        }
        .box {
            
            border: 1px solid black;
            background-color: aquamarine;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
</body>
</body>
</html>
